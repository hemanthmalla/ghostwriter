<style>
    /* Font size scaling — multiply all hardcoded px sizes by the scale factor */
    #container { font-size: calc(18px * var(--font-scale, 1)); }
    #container h1 { font-size: calc(26px * var(--font-scale, 1)); }
    #container h2 { font-size: calc(24px * var(--font-scale, 1)); }
    #container h3 { font-size: calc(20px * var(--font-scale, 1)); }
    #container h4 { font-size: calc(18px * var(--font-scale, 1)); }
    #container h5 { font-size: calc(16px * var(--font-scale, 1)); }
    #container h6 { font-size: calc(14px * var(--font-scale, 1)); }
    #container pre { font-size: calc(16px * var(--font-scale, 1)); }
    #container code { font-size: calc(90% * var(--font-scale, 1)); }
    #container .post-title,
    #container .page-title { font-size: calc(52px * var(--font-scale, 1)); }
    #container .post-date,
    #container .post-reading,
    #container .blog-description { font-size: calc(14px * var(--font-scale, 1)); }
    #container .post-tags,
    #container .share { font-size: calc(14px * var(--font-scale, 1)); }
    #container .share a { font-size: calc(16px * var(--font-scale, 1)); }
    #container .post-stub-tag { font-size: calc(10px * var(--font-scale, 1)); }
    #container .site-nav-item { font-size: calc(14px * var(--font-scale, 1)); }
    #container .author-name { font-size: calc(52px * var(--font-scale, 1)); }
    #container .author-meta { font-size: calc(14px * var(--font-scale, 1)); }

    /* ===== Reading progress bar ===== */
    .reading-progress {
        position: fixed;
        bottom: 0;
        left: 0;
        height: 3px;
        width: 0%;
        background: #F03838;
        z-index: 10000;
        transition: width 0.1s linear;
        pointer-events: none;
    }

    /* ===== Bottom floating nav bar ===== */
    .bottom-nav {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .bottom-nav-bar {
        display: flex;
        align-items: center;
        background: rgba(254, 254, 254, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 22px;
        padding: 4px;
        gap: 0;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .bottom-nav-divider {
        width: 1px;
        height: 20px;
        background: rgba(0, 0, 0, 0.15);
        flex-shrink: 0;
        margin: 0 2px;
    }

    .bottom-nav-btn {
        background: none;
        border: none;
        width: 36px;
        height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        color: #303030;
        padding: 0;
        flex-shrink: 0;
        border-radius: 18px;
        transition: background 0.2s ease, color 0.2s ease;
    }

    .bottom-nav-btn:hover {
        background: rgba(0, 0, 0, 0.07);
    }

    .bottom-nav-btn .font-label {
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
    }

    .bottom-nav-btn .font-symbol {
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        margin-left: 1px;
    }

    /* TOC toggle button */
    .bottom-nav-toc-toggle {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 16px;
        color: #303030;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        max-width: 220px;
        transition: background 0.2s ease;
    }

    .bottom-nav-toc-toggle:hover {
        background: rgba(0, 0, 0, 0.07);
    }

    .toc-current-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 180px;
    }

    .toc-chevron {
        flex-shrink: 0;
        transition: transform 0.3s ease;
    }

    .bottom-nav.open .toc-chevron {
        transform: rotate(180deg);
    }

    /* Hide TOC section on non-post pages */
    .bottom-nav-toc-toggle.hidden,
    .bottom-nav-toc-toggle.hidden + .bottom-nav-divider {
        display: none;
    }

    /* Also hide the divider before the TOC when there's no TOC */
    .bottom-nav-divider.before-toc.hidden {
        display: none;
    }

    /* Dropdown panel */
    .bottom-nav-dropdown {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%) scale(0.95);
        transform-origin: bottom center;
        margin-bottom: 8px;
        background: rgba(254, 254, 254, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 16px;
        padding: 6px;
        min-width: 280px;
        max-width: 360px;
        max-height: 60vh;
        overflow-y: auto;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .bottom-nav.open .bottom-nav-dropdown {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) scale(1);
    }

    .toc-link {
        display: block;
        padding: 10px 14px;
        border-radius: 10px;
        color: #424242;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.4;
        text-decoration: none;
        transition: background 0.15s ease;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .toc-link:hover {
        background: rgba(0, 0, 0, 0.06);
        color: #424242;
    }

    .toc-link.active {
        background: rgba(240, 56, 56, 0.08);
        color: #F03838;
        font-weight: 600;
    }

    .toc-link.toc-h3 {
        padding-left: 28px;
        font-size: 13px;
    }

    #dark-mode-toggle .icon-sun { display: none; }
    #dark-mode-toggle .icon-moon { display: inline; }

    /* ===== Dark mode ===== */
    [data-theme="dark"] {
        background: #1a1a2e;
        color: #e0e0e0;
    }

    [data-theme="dark"] .bottom-nav-bar {
        background: rgba(26, 26, 46, 0.85);
        border-color: rgba(255, 255, 255, 0.1);
    }

    [data-theme="dark"] .bottom-nav-divider {
        background: rgba(255, 255, 255, 0.15);
    }

    [data-theme="dark"] .bottom-nav-btn {
        color: #e0e0e0;
    }

    [data-theme="dark"] .bottom-nav-btn:hover {
        background: rgba(255, 255, 255, 0.1);
    }

    [data-theme="dark"] .bottom-nav-toc-toggle {
        color: #e0e0e0;
    }

    [data-theme="dark"] .bottom-nav-toc-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
    }

    [data-theme="dark"] .bottom-nav-dropdown {
        background: rgba(26, 26, 46, 0.92);
        border-color: rgba(255, 255, 255, 0.1);
    }

    [data-theme="dark"] .toc-link {
        color: #d0d0d0;
    }

    [data-theme="dark"] .toc-link:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #e0e0e0;
    }

    [data-theme="dark"] .toc-link.active {
        background: rgba(240, 56, 56, 0.15);
        color: #ff6b6b;
    }

    [data-theme="dark"] #dark-mode-toggle .icon-sun { display: inline; }
    [data-theme="dark"] #dark-mode-toggle .icon-moon { display: none; }

    /* Header */
    [data-theme="dark"] .site-header {
        background: #1a1a2e;
    }

    [data-theme="dark"] .site-title a:hover {
        background: #e0e0e0;
        color: #1a1a2e;
    }

    [data-theme="dark"] .button-square:hover {
        background: #e0e0e0;
        color: #1a1a2e;
    }

    [data-theme="dark"] .site-nav-item a {
        color: #e0e0e0;
    }

    [data-theme="dark"] .site-nav-item a:hover {
        color: #F03838;
    }

    /* Body / Content */
    [data-theme="dark"] h1,
    [data-theme="dark"] h2,
    [data-theme="dark"] h3,
    [data-theme="dark"] h4,
    [data-theme="dark"] h5,
    [data-theme="dark"] h6 {
        color: #f0f0f0;
    }

    [data-theme="dark"] p,
    [data-theme="dark"] li,
    [data-theme="dark"] td,
    [data-theme="dark"] th {
        color: #d0d0d0;
    }

    [data-theme="dark"] a {
        color: #ff6b6b;
    }

    [data-theme="dark"] blockquote {
        border-left-color: #ff6b6b;
    }

    [data-theme="dark"] blockquote p {
        color: #999;
    }

    [data-theme="dark"] pre {
        background: #16213e;
        border-color: #2a2a4a;
        color: #e0e0e0;
    }

    [data-theme="dark"] code {
        background-color: #16213e;
        color: #e0e0e0;
    }

    [data-theme="dark"] hr {
        border-bottom-color: #444;
    }

    [data-theme="dark"] table tbody > tr:nth-child(odd) > td,
    [data-theme="dark"] table tbody > tr:nth-child(odd) > th {
        background-color: #16213e;
    }

    [data-theme="dark"] table tr {
        border-bottom-color: #444;
    }

    /* Post elements */
    [data-theme="dark"] .post-header {
        border-bottom-color: #555;
    }

    [data-theme="dark"] .post-title,
    [data-theme="dark"] .page-title {
        color: #f0f0f0;
    }

    [data-theme="dark"] .post-date,
    [data-theme="dark"] .post-reading,
    [data-theme="dark"] .blog-description {
        color: #888;
    }

    [data-theme="dark"] .post-date a,
    [data-theme="dark"] .post-reading a,
    [data-theme="dark"] .blog-description a {
        color: #888;
    }

    [data-theme="dark"] .post-line:after {
        border-bottom-color: #555;
    }

    [data-theme="dark"] .post-content a:hover {
        border-bottom-color: #ff6b6b;
    }

    [data-theme="dark"] .post-tags,
    [data-theme="dark"] .share {
        color: #888;
    }

    /* Post list / stubs */
    [data-theme="dark"] .post-stub {
        border-bottom-color: #444;
    }

    [data-theme="dark"] .post-stub a {
        color: #d0d0d0;
    }

    [data-theme="dark"] .post-stub a:hover {
        background: #16213e;
        color: #ff6b6b;
    }

    [data-theme="dark"] .post-stub-tag {
        background: #555;
    }

    /* Navigation buttons */
    [data-theme="dark"] .newer-posts:hover,
    [data-theme="dark"] .older-posts:hover {
        background: #e0e0e0;
        color: #1a1a2e;
    }

    /* Author */
    [data-theme="dark"] .author-name {
        color: #f0f0f0;
    }

    [data-theme="dark"] .author-meta {
        color: #888;
    }

    [data-theme="dark"] .author-profile:after {
        border-bottom-color: #444;
    }

    /* Footer */
    [data-theme="dark"] .footer {
        background: #0f0f23;
    }

    [data-theme="dark"] .footer .site-title a:hover,
    [data-theme="dark"] .footer .button-square:hover {
        background: #F03838;
    }

    /* Wrapper */
    [data-theme="dark"] #wrapper {
        background: #1a1a2e;
    }

    /* Selection */
    [data-theme="dark"] ::selection {
        background: #F03838;
        color: #fff;
    }

    [data-theme="dark"] ::-moz-selection {
        background: #F03838;
        color: #fff;
    }

    /* Syntax highlighting */
    [data-theme="dark"] .highlight pre,
    [data-theme="dark"] .highlight code {
        background: #16213e;
        color: #e0e0e0;
    }

    [data-theme="dark"] .chroma {
        background: #16213e;
        color: #e0e0e0;
    }

    /* Syntax token overrides for dark mode */
    [data-theme="dark"] .chroma .k,
    [data-theme="dark"] .chroma .kc,
    [data-theme="dark"] .chroma .kd,
    [data-theme="dark"] .chroma .kn,
    [data-theme="dark"] .chroma .kp,
    [data-theme="dark"] .chroma .kr { color: #c792ea; }

    [data-theme="dark"] .chroma .o,
    [data-theme="dark"] .chroma .p { color: #89ddff; }

    [data-theme="dark"] .chroma .n,
    [data-theme="dark"] .chroma .na,
    [data-theme="dark"] .chroma .nb,
    [data-theme="dark"] .chroma .nc,
    [data-theme="dark"] .chroma .no,
    [data-theme="dark"] .chroma .nd,
    [data-theme="dark"] .chroma .ni,
    [data-theme="dark"] .chroma .ne,
    [data-theme="dark"] .chroma .nf,
    [data-theme="dark"] .chroma .nn,
    [data-theme="dark"] .chroma .nt,
    [data-theme="dark"] .chroma .nv { color: #82aaff; }

    [data-theme="dark"] .chroma .s,
    [data-theme="dark"] .chroma .sa,
    [data-theme="dark"] .chroma .sb,
    [data-theme="dark"] .chroma .sc,
    [data-theme="dark"] .chroma .dl,
    [data-theme="dark"] .chroma .sd,
    [data-theme="dark"] .chroma .s2,
    [data-theme="dark"] .chroma .se,
    [data-theme="dark"] .chroma .sh,
    [data-theme="dark"] .chroma .si,
    [data-theme="dark"] .chroma .sx,
    [data-theme="dark"] .chroma .sr,
    [data-theme="dark"] .chroma .s1,
    [data-theme="dark"] .chroma .ss { color: #c3e88d; }

    [data-theme="dark"] .chroma .m,
    [data-theme="dark"] .chroma .mb,
    [data-theme="dark"] .chroma .mf,
    [data-theme="dark"] .chroma .mh,
    [data-theme="dark"] .chroma .mi,
    [data-theme="dark"] .chroma .il,
    [data-theme="dark"] .chroma .mo { color: #f78c6c; }

    [data-theme="dark"] .chroma .c,
    [data-theme="dark"] .chroma .ch,
    [data-theme="dark"] .chroma .cm,
    [data-theme="dark"] .chroma .c1,
    [data-theme="dark"] .chroma .cs,
    [data-theme="dark"] .chroma .cp,
    [data-theme="dark"] .chroma .cpf { color: #676e95; }

    [data-theme="dark"] .chroma .gd { color: #ff5370; background: rgba(255,83,112,0.1); }
    [data-theme="dark"] .chroma .gi { color: #c3e88d; background: rgba(195,232,141,0.1); }
    [data-theme="dark"] .chroma .ge { font-style: italic; }
    [data-theme="dark"] .chroma .gs { font-weight: bold; }
</style>

<!-- Prevent flash of wrong theme/font-size -->
<script>
    (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        var fs = localStorage.getItem('font-scale');
        if (fs) {
            document.documentElement.style.setProperty('--font-scale', fs);
        }
    })();
</script>
